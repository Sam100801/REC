version: "3.8"

services:

  my-sba-abitazione:
    image: bellsoft/liberica-openjdk-alpine:17
    container_name: mysbaimage-abitazione
    ports:
      - 8085:8080
      - 8005:8000
    expose:
      - "8005"
    depends_on:
      - my-db-abitazione
    networks:
      - my-net
    volumes:
      - ./build/libs/AbitazioneService-0.0.1-SNAPSHOT.jar:/app/app.jar
    working_dir: /app
    entrypoint: java -Xdebug -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000 -jar /app/app.jar


  my-db-abitazione:
    image: mongo:5.0
    container_name: mongodbimage-abitazione
    ports:
      - 27021:27021
    command: ["mongod", "--port", "27021"]
    networks:
      - my-net

networks:
  my-net:
    driver: "bridge"
