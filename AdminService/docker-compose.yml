version: "3.8"

services:

  my-sba-adminservice:
    image: bellsoft/liberica-openjdk-alpine:17
    container_name: mysbaimage-adminservice
    ports:
      - 8089:8080
      - 8009:8000
    expose:
      - "8009"
    depends_on:
      - my-db-adminservice
    networks:
      - my-net
    volumes:
      - ./build/libs/AdminService-0.0.1-SNAPSHOT.jar:/app/app.jar
    working_dir: /app
    entrypoint: java -Xdebug -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000 -jar /app/app.jar


  my-db-adminservice:
    image: mongo:5.0
    container_name: mongodbimage-adminservice
    ports:
      - 27025:27025
    command: ["mongod", "--port", "27021"]
    networks:
      - my-net

networks:
  my-net:
    driver: "bridge"

