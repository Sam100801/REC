version: "3.8"

services:

  my-sba-notification:
    image: bellsoft/liberica-openjdk-alpine:17
    container_name: notificationimage
    ports:
      - 8084:8080
      - 8004:8000
    expose:
      - "8004"
    networks:
      - my-net
    volumes:
      - ./build/libs/MicroserviceNotification-0.0.1-SNAPSHOT.jar:/app/app.jar
    working_dir: /app
    entrypoint: java -Xdebug -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000 -jar /app/app.jar

networks:
  my-net:
    driver: "bridge"


