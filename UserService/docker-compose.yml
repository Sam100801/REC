version: "3.8"

services:

  my-sba-userservice:
    image: bellsoft/liberica-openjdk-alpine:17
    container_name: mysbaimage-userservice
    ports:
      - 8088:8080
      - 8008:8000
    expose:
      - "8008"
    depends_on:
      - my-db-userservice
    networks:
      - my-net
    volumes:
      - ./build/libs/UserService-0.0.1-SNAPSHOT.jar:/app/app.jar
    working_dir: /app
    entrypoint: java -Xdebug -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000 -jar /app/app.jar


  my-db-userservice:
    image: mongo:5.0
    container_name: mongodbimage-userservice
    ports:
      - 27024:27024
    command: ["mongod", "--port", "27024"]
    networks:
      - my-net

networks:
  my-net:
    driver: "bridge"

